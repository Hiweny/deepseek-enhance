name: Build DeepSleep APK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.js'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets 不能直接出现在 step 的 if 表达式里，先落到 job 级 env 再使用
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          CT=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          if [ -n "$CT" ]; then
            yes | "$CT/sdkmanager" --licenses >/dev/null 2>&1
            yes | "$CT/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1
          fi
          echo "platforms:"; ls "$SDK/platforms" 2>/dev/null
          echo "build-tools:"; ls "$SDK/build-tools" 2>/dev/null
          exit 0

      - name: Build userscript & inject.js
        run: node build.js

      # 从 Secrets 还原固定签名 keystore：签名稳定才能“覆盖更新”，
      # 否则 CI 每次重建 debug keystore，签名不一致只能先卸载再装。
      - name: Prepare signing keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deepsleep.jks"
            {
              echo "DSE_KEYSTORE=$RUNNER_TEMP/deepsleep.jks"
              echo "DSE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "DSE_KEY_ALIAS=$KEY_ALIAS"
              echo "DSE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "::notice::using fixed release keystore from repository secrets"
          else
            echo "::warning::KEYSTORE_BASE64 missing - falling back to debug signing"
          fi

      - name: Verify InlineJs bootstrap (syntax)
        working-directory: android
        run: |
          mkdir -p build/gen
          javac -d build/gen tools/Gen.java
          java -cp build/gen Gen app/src/main/java ../dist/inject.js build/gen
          node --check build/gen/full-true.js
          node --check build/gen/full-false.js
          echo "InlineJs bootstrap syntax OK"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DeepSleep.apk

      - name: Verify APK signature
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs DeepSleep.apk; fi
          ls -l DeepSleep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSleep-apk
          path: DeepSleep.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeepSleep-apk
          path: .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 3072
          disable-animations: true
          script: |
            set +e
            adb install -r DeepSleep.apk
            echo "=== installed versionCode ==="; adb shell dumpsys package com.deepsleep.app | grep -E "versionCode|versionName" | head -3
            adb shell am start -n com.deepsleep.app/.MainActivity
            sleep 30
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png apk-screenshot.png
            echo "=== process alive? (pid) ==="; adb shell pidof com.deepsleep.app
            PID=$(adb shell pidof com.deepsleep.app | tr -d '\r'); adb forward tcp:9222 localabstract:webview_devtools_remote_$PID; echo "=== webview devtools targets ==="; curl -s --max-time 6 http://127.0.0.1:9222/json
            echo "=== done ==="
            exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-screenshot
          path: apk-screenshot.png
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeepSleep-apk
          path: .
      - name: Publish release (overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk --repo "$GITHUB_REPOSITORY" \
              --title "DeepSleep APK (latest)" \
              --notes "自动构建的最新 DeepSleep APK（同源 dist/inject.js）。每次构建覆盖更新本 Release 的资产。固定签名，可直接覆盖安装。" 
          gh release upload apk DeepSleep.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/apk/DeepSleep.apk"
